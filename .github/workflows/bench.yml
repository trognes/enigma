name: Bench

# Performance benchmarks (tests/bench.sh) across both compilers and both Linux
# architectures: x86_64 (ubuntu-24.04) and arm64 (ubuntu-24.04-arm; free for
# public repositories). The hot path is compiler- AND arch-sensitive (see the
# struct-layout / aliasing notes in CLAUDE.md), so a change can regress one
# cell of this matrix while the other three stay clean.
#
# On pull requests each cell runs the same-machine A/B (make bench BASE=<PR
# base> LONG=1) -- the only reliable comparison, since absolute timings differ
# per runner.
#
# TWO LEVELS, because one number cannot serve both purposes. Anything over 10%
# is REPORTED and flagged, but does not fail the job: shared runners are noisy
# and the climb/scan tiers are bimodal on them, with base-vs-base controls on
# byte-identical code measuring up to +-10% on the clang hillclimb tier
# (CLAUDE.md). A hard 10% gate across this 4-cell matrix would fail clean PRs.
# Anything over FAIL_OVER=25% BLOCKS: that is 2.5x the worst noise floor ever
# recorded in this repo, so it cannot plausibly be scatter. The step is no
# longer continue-on-error -- it used to be, and a +50% crib-sweep regression
# was reported and merely advisory, which is exactly the case this must stop.
#
# So: a flagged-but-passing cell means "re-check on quiet hardware and compare
# disassembly"; a failed cell means the regression is real, fix it.
#
# On pushes to the long-lived branches (and manual dispatch) there is no
# meaningful base, so each cell just records HEAD timings as a reference.

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (${{ matrix.cxx }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     arch: x86_64, cxx: g++ }
          - { os: ubuntu-24.04,     arch: x86_64, cxx: clang++ }
          - { os: ubuntu-24.04-arm, arch: arm64,  cxx: g++ }
          - { os: ubuntu-24.04-arm, arch: arm64,  cxx: clang++ }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the A/B builds BASE from a git worktree, so it needs history
      - name: Compiler and machine
        run: |
          ${{ matrix.cxx }} --version
          uname -m
          nproc
      - name: Build
        run: make CXX=${{ matrix.cxx }}
      - name: Bench A/B vs PR base (reports at 10%, fails over 25%)
        if: github.event_name == 'pull_request'
        # No THRESHOLD override: CI reports at the same 10% the script defaults
        # to, so there is one number and it cannot drift from the docs.
        # FAIL_OVER is what blocks, and is deliberately far above the floor.
        env:
          FAIL_OVER: 25
        run: make bench CXX=${{ matrix.cxx }} LONG=1 BASE=${{ github.event.pull_request.base.sha }}
      - name: Bench HEAD (reference timings)
        if: github.event_name != 'pull_request'
        run: make bench CXX=${{ matrix.cxx }} LONG=1
