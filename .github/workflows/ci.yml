name: CI

# A push to a branch with an open PR is BOTH a push and a pull_request event,
# so a bare `push:` ran the whole matrix twice per PR -- 24 check runs where 12
# say the same thing. Restricting push to the long-lived branches leaves each
# commit checked exactly once: by pull_request while it is under review, by
# push once it lands on dev or master. This is what codeql.yml and bench.yml
# already do.
#
# The two events are not merely duplicates of each other, and pull_request is
# the more useful one: it builds the PR head MERGED INTO its base, i.e. what
# the repository would actually get, whereas push builds the branch head
# alone. The cost is that a branch pushed without a PR gets no CI; every
# branch here becomes a PR, so that case does not arise.
on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  # Fast gate: build with both compilers as -Werror and run the test suite.
  #
  # g++-14 is a THIRD cell rather than an upgrade of the g++ one, and it is
  # installed by name rather than taken from the image. Both choices are
  # deliberate:
  #
  #   * The build is -Werror, so every warning a newer gcc introduces becomes a
  #     red build. Naming the version means that happens on a commit here, not
  #     whenever GitHub repoints ubuntu-latest -- which would break the build on
  #     their schedule, for reasons unrelated to the change under review.
  #   * Keeping the default g++ cell as well means the version most users have
  #     stays covered while the newer one warns about what is coming.
  #
  # This was added after a -Wformat-truncation warning reached a user on Debian
  # 13 (gcc 14) that CI could not see: the runners carry gcc 13.3, which does
  # not emit it. Verified to earn its keep -- reverting that fix makes this cell
  # fail the build and leaves the other two green.
  test:
    name: build & test (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, g++-14, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install ${{ matrix.cxx }}
        if: matrix.cxx == 'g++-14'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-14
      - name: Compiler version
        run: ${{ matrix.cxx }} --version
      - name: Build (-Werror)
        run: make CXX=${{ matrix.cxx }} EXTRA_CXXFLAGS=-Werror
      - name: Test
        run: make test CXX=${{ matrix.cxx }} EXTRA_CXXFLAGS=-Werror

  # AddressSanitizer + UndefinedBehaviorSanitizer over the suite. TEST_QUICK=1 shrinks
  # the end-to-end cracking checks (one language, a 26-key wildcard instead of the full
  # 26^3, so no 676-key x restart hill-climbs): ASan slows every key-scan ~10x, and the
  # full matrix took ~8 min for zero extra *memory-safety* coverage (recovery and
  # determinism are already verified by the fast g++/clang jobs). This still exercises
  # every code path -- all scorers, scan, hill-climb, restarts, staging, pre-filter, M4,
  # Norway, input handling -- in well under a minute.
  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    env:
      EXTRA_CXXFLAGS: "-fsanitize=address,undefined -fno-sanitize-recover=all -g"
      UBSAN_OPTIONS: print_stacktrace=1
      TEST_QUICK: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Run suite under sanitizers
        run: make test EXTRA_CXXFLAGS="$EXTRA_CXXFLAGS"
      - name: Extra coverage (-p compare, all scoring models)
        run: |
          printf 'AAAAAAAAAAAAAAAAAAAA' > pt.txt
          printf 'BDZGOWCXLTKSBTMCDLPB' | ./enigma -i -u B -w 123 -r AAA -g AAA -p pt.txt
          for s in -m -b -t -q; do
            printf 'BDZGOWCXLT' | ./enigma $s -u B -w 123 -r AAA -g AAA -l english >/dev/null
          done
          # Simulated-annealing plugboard climb (-A): its own RNG/toggle/quench path,
          # both uncapped and with the -S target cap (cap-aware apply_toggle).
          printf 'OWUJLGEZLXLQTANLYHLFKCJXOKTNHKJFVKQPVTQW' \
            | ./enigma -q -l english -u B -w 123 -r AAA -g AAA -c -A 5000 >/dev/null
          printf 'OWUJLGEZLXLQTANLYHLFKCJXOKTNHKJFVKQPVTQW' \
            | ./enigma -q -l english -u B -w 123 -r AAA -g AAA -c -A 5000 -S q6 >/dev/null

  # ThreadSanitizer targets DATA RACES in the threaded search only, so it runs a
  # small, high-concurrency workload rather than the whole suite. The single-
  # threaded KATs/round-trips/cracks have no threads for TSan to inspect and are
  # already covered by the g++/clang/ASan jobs -- running them under TSan added
  # ~20 min for zero extra race coverage. The runs below drive both worker branches
  # at -T 8 over a multi-task key space (parallel precompute across reflectors x
  # wheel-orders, concurrent workers, the best-result mutex merge), including the
  # restart RNG, the plugboard perturbation and the staged climb. halt_on_error=1
  # makes any race fail the job; the -T-determinism contract itself is asserted in
  # the regular (fast) suite.
  tsan:
    name: sanitizers (tsan)
    runs-on: ubuntu-latest
    env:
      EXTRA_CXXFLAGS: "-fsanitize=thread -fno-sanitize-recover=all -g"
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - name: Build (ThreadSanitizer)
        run: make EXTRA_CXXFLAGS="$EXTRA_CXXFLAGS"
      - name: Threaded scan is race-free (-T 8)
        run: |
          # plain scan path (no hill-climb): concurrent workers + mutex merge over
          # 3 reflectors x 2 wheel-orders x 26 starts.
          printf 'OWUJLGEZLXLQTANLYHLFKCJXOKTNHKJFVKQPVTQW' \
            | ./enigma -i -u . -w 12. -x 4 -r AAA -g .AA -T 8 >/dev/null
      - name: Threaded hill-climb is race-free (-T 8)
        run: |
          # hill-climb path: adds restarts (-R), the plugboard perturbation (--random) and a
          # staged IC->quad climb (--score) on top of the same parallel key space.
          printf 'OWUJLGEZLXLQTANLYHLFKCJXOKTNHKJFVKQPVTQW' \
            | ./enigma -q -l english -u . -w 12. -x 4 -r AAA -g .AA -c -R 3 --score iq --random 2 -T 8 >/dev/null
      - name: Threaded simulated-annealing climb is race-free (-T 8)
        run: |
          # -A path: per-key SA RNG stream + toggle moves + greedy quench across the
          # same parallel key space; must stay race-free and -T-deterministic.
          printf 'OWUJLGEZLXLQTANLYHLFKCJXOKTNHKJFVKQPVTQW' \
            | ./enigma -q -l english -u . -w 12. -x 4 -r AAA -g .AA -c -A 8000 -S q6 -T 8 >/dev/null

  # Valgrind adds detection of *uninitialised* memory use that ASan misses.
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build (debug)
        run: make EXTRA_CXXFLAGS="-O1 -g"
      - name: Run representative invocations under valgrind
        run: |
          VG="valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite -q"
          printf 'BDZGOWCXLTKSBTMCDLPB' | $VG ./enigma -i -u B -w 123 -r AAA -g AAA >/dev/null
          printf 'OWUJLGEZLXLQTANLYHLFKCJXOKTNHKJFVKQPVTQW' | $VG ./enigma -u B -w 123 -r AAA -g AAA -c -l english >/dev/null
          printf 'AAAAAAAAAAAAAAAAAAAA' > pt.txt
          printf 'BDZGOWCXLTKSBTMCDLPB' | $VG ./enigma -i -u B -w 123 -r AAA -g AAA -p pt.txt >/dev/null

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: cppcheck --enable=warning,performance,portability --inline-suppr --std=c++17 --error-exitcode=1 src/

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      # Every translation unit, and (via HeaderFilterRegex in .clang-tidy) the
      # headers too. A header included by several .cc files reports its findings
      # once per includer -- noisy, but the alternative is headers going
      # unchecked entirely, which is where a shared inline hot-path function
      # would hide. A clean tree still reports ZERO `error:` lines.
      - name: Run clang-tidy
        run: clang-tidy src/*.cc -- -std=c++17   # checks come from .clang-tidy

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck on the shell harness
        run: shellcheck tests/run_tests.sh tests/bench.sh
      - name: Byte-compile the Python harness
        run: python3 -m py_compile tests/crack_quality.py
